name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: go vet and unit tests
        working-directory: backend
        run: |
          go vet ./...
          go test ./... -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  integration-and-e2e:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: generate a small corpus and index it
        run: |
          python3 data/gen/generate_documents.py 20000 /tmp/documents.ndjson
          cd backend && go run ./cmd/indexer /tmp/documents.ndjson http://localhost:9200

      - name: start the backend for the bypass audit
        run: |
          cd backend
          ES_ADDR=http://localhost:9200 PORT=8081 nohup go run ./cmd/server > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid
          for i in $(seq 1 30); do curl -sf http://localhost:8081/api/health && break; sleep 1; done

      - name: bypass audit (40 direct-API calls, every one must be rejected)
        run: |
          cd backend
          go run ./cmd/bypassaudit http://localhost:8081

      - name: stop the bypass-audit backend
        # Playwright's own webServer starts a fresh instance below; running
        # both at once would fight over port 8081.
        run: kill "$(cat /tmp/server.pid)"

      - name: build frontend and run Playwright E2E against the real backend
        working-directory: frontend
        env:
          DSTC_TEST_PORT: "8081"
          DSTC_TEST_ES_ADDR: "http://localhost:9200"
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          npx playwright test

  # Brings the whole stack up on a real Linux Kubernetes cluster (kind,
  # inside the ubuntu-latest runner) with one `helm install`, then proves
  # the console and API actually answer through the NodePorts the chart
  # exposes. The loader job indexes a small CI-sized corpus (see
  # deploy/helm/.../values.yaml `loader.docCount`) so this gate finishes in
  # minutes; the README's measured numbers come from a separate 1.2M-
  # document run on the build machine, not from this fixture.
  deploy-smoke-test:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: build images
        run: |
          docker build -f deploy/Dockerfile.backend -t document-search-triage-console-backend:dev .
          docker build -f deploy/Dockerfile.frontend -t document-search-triage-console-frontend:dev .
          docker build -f deploy/Dockerfile.loader -t document-search-triage-console-loader:dev .

      - uses: helm/kind-action@v1
        with:
          cluster_name: dstc
          config: deploy/kind-cluster.yaml

      - name: load images into kind
        run: |
          kind load docker-image document-search-triage-console-backend:dev --name dstc
          kind load docker-image document-search-triage-console-frontend:dev --name dstc
          kind load docker-image document-search-triage-console-loader:dev --name dstc

      - name: helm install
        run: |
          helm install dstc ./deploy/helm/document-search-triage-console \
            --set loader.docCount=20000 \
            --wait --timeout 5m

      - name: smoke test the deployed stack
        run: |
          set -euo pipefail
          curl -sf http://localhost:30081/api/health
          TOKEN=$(curl -sf -X POST http://localhost:30081/api/session \
            -H "Content-Type: application/json" -d '{"username":"analyst1"}' \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["token"])')
          COUNT=$(curl -sf "http://localhost:30081/api/search?size=1" \
            -H "Authorization: Bearer ${TOKEN}" | python3 -c 'import sys,json; print(json.load(sys.stdin)["total"])')
          echo "indexed document count reported by API: ${COUNT}"
          if [ "${COUNT}" -lt 1000 ]; then
            echo "expected at least 1000 documents to be indexed by the loader job"
            exit 1
          fi
          curl -sf -o /dev/null http://localhost:30080/

      - name: dump pod state on failure
        if: failure()
        run: |
          kubectl get pods -o wide
          kubectl describe pods
          kubectl logs -l app=dstc-backend --tail=200 || true
          kubectl logs job/dstc-loader --tail=200 || true
